# GitLab CI/CD pipeline: validate -> test -> build (+ push to registry) -> deploy
# The deploy job runs only on a runner tagged "deploy" installed on the Linux server.

stages:
  - validate
  - test
  - build
  - deploy

variables:
  # Keep pip's download cache inside the project so GitLab can cache it
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# Settings shared by the two Python jobs
.python-job:
  image: python:3.12-slim
  cache:
    key:
      files:
        - requirements.txt
    paths:
      - .cache/pip

validate:
  extends: .python-job
  stage: validate
  script:
    # Fails if any Python file has a syntax error
    - python -m compileall -q app tests
    # Fails if a file the pipeline needs is missing
    - test -f Dockerfile
    - test -f requirements.txt

test:
  extends: .python-job
  stage: test
  script:
    - pip install -r requirements.txt
    - pytest -v --junitxml=report.xml
  artifacts:
    when: always            # keep the report even if tests fail
    reports:
      junit: report.xml     # GitLab shows test results in the pipeline page

build:
  stage: build
  image: docker:27-cli
  services:
    - docker:27-dind        # a Docker engine the job can talk to
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"   # registry path + commit ID
  before_script:
    # CI_JOB_TOKEN is a temporary token GitLab creates for this job only
    - echo "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token --password-stdin "$CI_REGISTRY"
  script:
    # The tag is the commit SHA, so every image is traceable to its code
    - docker build -t "$IMAGE" .
    - docker push "$IMAGE"
    # 'latest' is only a convenience label; deployments use the SHA tag
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$IMAGE" "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:latest"
      fi

deploy:
  stage: deploy
  tags:
    - deploy                # only a runner tagged "deploy" (ours, on the server) takes this job
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH   # deploy from main only
  environment:
    name: production
    url: http://192.168.175.128:8000
  variables:
    IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  script:
    - bash deploy/deploy.sh
