# GitLab CI/CD pipeline: validate -> test -> build (+ push to registry) -> scan -> deploy
# The deploy job runs only on a runner tagged "deploy" installed on the Linux server.

stages:
  - validate
  - test
  - build
  - scan
  - deploy

# Branch pipelines only: no merge request pipelines, so a branch with an open MR
# never gets two pipelines (one per type). Tag pipelines are not used in this project.
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH

variables:
  # Keep pip's download cache inside the project so GitLab can cache it
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# Files that affect the running app. A push that changes none of them (for example
# README or docs only) creates no pipeline and no deployment. Consequence: /api/status
# shows the last DEPLOYED code commit, which can differ from the latest commit on main.
# Manual ("Run pipeline"), scheduled and new-branch pipelines have no push diff, so
# GitLab treats every file as changed and all jobs run.
.app-files:
  rules:
    - changes: &app-files
        - app/**/*
        - tests/**/*
        - requirements.txt
        - Dockerfile
        - .dockerignore
        - deploy/**/*
        - .gitlab-ci.yml

# Settings shared by the two Python jobs
.python-job:
  image: python:3.12-slim
  rules:
    - changes: *app-files
  cache:
    key:
      files:
        - requirements.txt
    paths:
      - .cache/pip

validate:
  extends: .python-job
  stage: validate
  script:
    # Fails if any Python file has a syntax error
    - python -m compileall -q app tests
    # Fails if a file the pipeline needs is missing
    - test -f Dockerfile
    - test -f requirements.txt

test:
  extends: .python-job
  stage: test
  script:
    - pip install -r requirements.txt
    - pytest -v --junitxml=report.xml
  artifacts:
    when: always            # keep the report even if tests fail
    reports:
      junit: report.xml     # GitLab shows test results in the pipeline page

build:
  stage: build
  rules:
    - changes: *app-files
  image: docker:27-cli
  services:
    - docker:27-dind        # a Docker engine the job can talk to
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"   # registry path + commit ID
  before_script:
    # CI_JOB_TOKEN is a temporary token GitLab creates for this job only
    - echo "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token --password-stdin "$CI_REGISTRY"
  script:
    # The tag is the commit SHA, so every image is traceable to its code
    - docker build -t "$IMAGE" .
    - docker push "$IMAGE"
    # 'latest' is only a convenience label; deployments use the SHA tag
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$IMAGE" "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:latest"
      fi

scan:
  stage: scan
  # No tags: runs on GitLab shared runners, not on our deploy runner.
  # The scanner image is pinned to an exact version AND digest, never "latest"
  # (Trivy supply-chain compromise, March 2026, GHSA-69fq-xp46-6x23). Digest of the
  # multi-arch index for 0.76.2, verified on Docker Hub and with `docker buildx imagetools inspect`.
  image:
    name: docker.io/aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
    entrypoint: [""]
  rules:
    - changes: *app-files
  variables:
    GIT_STRATEGY: none          # nothing from the repo is needed: we scan the pushed image
    TRIVY_NO_PROGRESS: "true"
    IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"   # the image the build job pushed
  script:
    - trivy --version
    # 1) Download the vulnerability DB WITHOUT registry credentials. Trivy sends TRIVY_USERNAME/
    #    TRIVY_PASSWORD to every registry it contacts, so they must not be set during this step.
    - trivy image --download-db-only
    # 2) Full report of HIGH and CRITICAL findings; never fails the job (exit code 0).
    #    Credentials are set only for this command. Scanned remotely: no Docker daemon, no dind.
    - TRIVY_USERNAME="$CI_REGISTRY_USER" TRIVY_PASSWORD="$CI_REGISTRY_PASSWORD"
      trivy image --image-src remote --skip-db-update --skip-java-db-update
      --severity HIGH,CRITICAL --exit-code 0 "$IMAGE"
    # 3) Gate: fail the job (and so block deploy) on CRITICAL vulnerabilities that have a fix.
    - TRIVY_USERNAME="$CI_REGISTRY_USER" TRIVY_PASSWORD="$CI_REGISTRY_PASSWORD"
      trivy image --image-src remote --skip-db-update --skip-java-db-update
      --severity CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE"

deploy:
  stage: deploy
  tags:
    - deploy                # only a runner tagged "deploy" (ours, on the server) takes this job
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH   # deploy from main only
      changes: *app-files                           # ...and only when app files changed
  resource_group: production   # only one deploy to production at a time, across all pipelines
  environment:
    name: production
    url: http://192.168.175.128:8000
  variables:
    IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    APP_VERSION: "$CI_COMMIT_SHORT_SHA"   # shown by /api/status
  script:
    - bash deploy/deploy.sh
